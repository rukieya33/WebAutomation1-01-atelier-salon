services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appointments
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_dev_password
    ports:
      - "5432:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d appointments"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/appointments
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: booking_dev_password
    ports:
      - "8080:8080"

volumes:
  booking-db-data:
